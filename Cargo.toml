[package]
name = "fabstir-llm-node"
version = "0.1.0"
edition = "2021"

# Risc0 zkVM configuration (Phase 1.1)
# Specifies guest program directories to compile
# Note: Paths are relative to workspace root
[package.metadata.risc0]
methods = ["methods/guest"]  # Will create this directory in Phase 1.2


[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
libp2p = { version = "0.54", features = ["kad", "mdns", "noise", "tcp", "yamux", "websocket", "quic", "identify", "rendezvous", "macros", "serde", "tokio", "dns", "request-response"] }
futures = { version = "0.3", features = ["executor"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-big-array = "0.5"  # #[serde(with = "BigArray")] for [u8;48] SEV-SNP/TDX launch measurements (src/tee)
bincode = "1.3"
ethers = { version = "2.0", features = ["abigen", "ws"] }
rand = "0.8"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
thiserror = "1.0"
asynchronous-codec = "0.7"
uuid = { version = "1.6", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "multipart"] }
libc = "0.2"                     # _exit from the stop watchdog (no atexit teardown under a live CUDA load)
rustls-native-certs = "0.6"     # probe the OS root store before building the TEE fetch client (already a reqwest dep)
tokio-tungstenite = "0.21"
axum = { version = "0.7", features = ["ws", "json", "macros"] }
axum-extra = { version = "0.9", features = ["multipart"] }  # Multipart form handling for image uploads
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = { version = "1.0", features = ["client", "server", "http1"] }
# Training sidecar UDS transport (T3 — the repo's first Unix-socket HTTP client)
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }

# LLM Inference  
llama-cpp-2 = { version = "=0.1.154", features = ["cuda"] }

# Model Management
hf-hub = "0.3"
sha2 = "0.10"
indicatif = "0.17"

# Image Processing (Sub-phase 1.1 - CPU-Based Vision)
# Used for /v1/ocr and /v1/describe-image endpoints
# Supports PNG, JPG, WebP, GIF loading and preprocessing
image = "0.25"

# Embedding dependencies (Sub-phase 1.1 - Host-Side Embeddings)
# ONNX Runtime for sentence transformer inference (all-MiniLM-L6-v2)
# Used for /v1/embed endpoint - zero-cost embeddings for SDK clients
ort = { version = "2.0.0-rc.10", features = ["download-binaries", "cuda"] }
tokenizers = "0.20"             # HuggingFace tokenizers for text preprocessing
ndarray = "0.16"                # N-dimensional arrays for tensor operations

# HNSW Index for fast vector search (Sub-phase 4.1 - HNSW Index Construction)
# Hierarchical Navigable Small World algorithm for approximate nearest neighbor search
# Used for searching large vector databases (10K-100K+ vectors) loaded from S5
hnsw_rs = "0.3"                 # Pure Rust HNSW implementation with serialization support

# Caching
lru = "0.12"
zstd = "0.13"

# Output Formatting
regex = "1.10"
ammonia = "3.3"
pulldown-cmark = "0.9"

# Utils
tempfile = "3.8"
jsonwebtoken = "9.2"
# Phase 5 P4 key broker (`fabstir-kbs`), feature `kbs` only. dcap-qvl's DEFAULT
# features are required: `report` is what gates `http` + `collateral` (it pulls
# reqwest 0.13 into the graph as a third major; its ReqwestHttp is unused, we
# supply `HttpClient`). `std` switches `serde_json/preserve_order` on for every
# `--features kbs` build (canonical_policy_bytes survives: sort_json_keys inserts
# sorted keys); tee_tests keep running without the feature.
dcap-qvl = { version = "0.6", optional = true }
zeroize = { version = "1", features = ["serde"], optional = true }

# Storage
ipfs-api = "0.17"
flate2 = "1.0"

# Additional utils
hex = "0.4"
url = "2"                       # URL parsing and validation

# Web Search (Sub-phase 1.1 - Host-Side Web Search)
# Rate limiting for search API requests
governor = "0.6"
# HTML parsing for content extraction (Phase 9)
scraper = "0.18"

# Result delivery dependencies
ciborium = "0.2"
ed25519-dalek = "2.1"
chrono = { version = "0.4", features = ["serde"] }
cid = "0.11"
multihash = "0.19"
bytes = "1.5"

# Storage dependencies
serde_cbor = "0.11"

# S5 Decentralized Storage (Phase 2.1 - Off-Chain Proof Storage)
# Native Rust client for direct P2P connection to S5 network
# Used for storing STARK proofs (221KB) off-chain to avoid RPC size limits
s5 = "0.1"

# EZKL dependencies (for mock implementation)
blake3 = "1.5"

# System monitoring dependencies
sysinfo = "0.30"

# Encryption dependencies
aes-gcm = "0.10"
pbkdf2 = "0.12"
base64 = "0.22"

# End-to-End Encryption (Phase 6.2)
k256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
tiny-keccak = { version = "2.0", features = ["keccak"] }

# Production hardening dependencies  
toml = "0.8"
prometheus = "0.13"

# GDPR module dependencies
bs58 = "0.5"

# CLI dependencies
clap = { version = "4.5", features = ["derive", "env"] }
dotenv = "0.15"

# Real Zero-Knowledge Proof Integration (Phase 1.1 - Risc0 zkVM)
# DECISION: Switched from EZKL to Risc0 zkVM (2025-10-14)
# Reason: EZKL designed for ML inference (wrong tool), Risc0 10x simpler
# Performance: 2-5s CPU proof generation, 194-281KB proofs (exceeds MVP requirements)
# To enable real ZK proofs:
#   1. Build with: cargo build --release --features real-ezkl
#
# NOTE: CUDA disabled due to vGPU incompatibility (NVIDIA A16-2Q)
# CPU proving is stable and reliable, just slightly slower than GPU
# System falls back to mock implementation when real-ezkl feature is disabled
risc0-zkvm = { version = "3.0", features = ["prove"], optional = true }
data-encoding = "2.10.0"

# Legacy EZKL dependencies (kept for reference, not used)
# ezkl = { git = "https://github.com/zkonduit/ezkl", rev = "40ce9df", optional = true }
# ark-std = { version = "0.4", optional = true }
# ark-ff = { version = "0.4", optional = true }
# ark-serialize = { version = "0.4", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tokio = { version = "1.35", features = ["test-util"] }
mockall = "0.12"
futures-util = "0.3"
ethers = { version = "2.0", features = ["ws", "rustls"] }
tempfile = "3.8"
rand = "0.8"
# Phase 5 TLS tests: a throwaway CA + a TLS 1.3 server for the pinned-root
# key-broker client. All three are already in the lock as transitive deps.
rcgen = "0.11"
rustls = "0.21"
tokio-rustls = "0.24"

# For benchmarking EZKL performance (Phase 1.1)
criterion = "0.5"

[build-dependencies]
# Risc0 build system for compiling guest programs (Phase 1.1)
risc0-build = { version = "3.0", optional = true }

[features]
default = ["inference", "real-ezkl"]
inference = []

# Real ZK Proof feature (Phase 1.1 - Risc0 zkVM) — ENABLED BY DEFAULT
# Real STARK proofs are generated by default. For mock proofs (testing only):
#   cargo build --no-default-features --features inference
# Performance: 0.2-2.3s generation, 194-281KB proofs, <1s verification
real-ezkl = ["risc0-zkvm", "risc0-build"]

# Occasional dev utilities, OFF by default. `publish-adapter` links the whole
# lib, so leaving it in the default set would relink a second full binary on
# every `cargo build` for a tool used a handful of times.
#   cargo build --release --features dev-tools --bin publish-adapter
dev-tools = []

# Phase 5 P4 key broker. Every bin in this crate links libcuda.so.1 (llama-cpp-2
# cuda is non-optional); the broker VPS ships the A-1 driver stub. Build:
#   cargo build --release --no-default-features --features inference,kbs --bin fabstir-kbs -j 4
kbs = ["dep:dcap-qvl", "dep:zeroize"]

[[bin]]
name = "publish-adapter"
path = "src/bin/publish-adapter.rs"
required-features = ["dev-tools"]

[[bin]]
name = "fabstir-kbs"
path = "src/bin/kbs.rs"
required-features = ["kbs"]

[[test]]
name = "performance_tests"
path = "tests/performance/mod.rs"

[[test]]
name = "kbs_tests"
path = "tests/kbs_tests.rs"
required-features = ["kbs"]

[[bench]]
name = "embed_benchmark"
harness = false
