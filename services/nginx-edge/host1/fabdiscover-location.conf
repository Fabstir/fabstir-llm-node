# FabCDN edge — FabDiscover trust-boundary location.
#
#   /fabdiscover/{search,health,geo}  → local fabdiscover-search reader
#                                       (127.0.0.1:7700)
#
# host1.fabstir.net variant. FabDiscover is served only at host1.fabstir.net
# (NEXT_PUBLIC_DISCOVERY_ENDPOINT=https://host1.fabstir.net/fabdiscover); the
# same route-agnostic block applies verbatim if host2 ever serves discovery.
#
# This block is the SECURITY trust boundary for territorial geo-fencing. The
# reader resolves the viewer's country from a precedence chain
#   X-Geo-Country → CF-IPCountry → CloudFront-Viewer-Country
#                 → app-layer MaxMind(rightmost X-Forwarded-For hop) → XX
# and treats XX (unknown) as permissive. The proxy_set_header lines below are
# what make that trust safe: hand the reader the real client IP, and neutralize
# the client-spoofable geo headers so a forged value can't win the chain.
# Without them, any client sets their own region by sending the header.
#
# ⚠ Companion hardening (NOT in this file — see README "FabDiscover Edge"):
#   the reader binds 0.0.0.0:7700, so :7700 is directly reachable and bypasses
#   this strip unless :7700 is firewalled to loopback on the box. Do that too.
#
# Prod: drops into /etc/nginx/snippets/fabdiscover-location.conf and is picked
# up via a one-line `include …;` inside the host1.fabstir.net server block.

location /fabdiscover/ {
    # Trailing slash is LOAD-BEARING: it strips the /fabdiscover/ prefix so
    # /fabdiscover/search → :7700/search (the reader matches startsWith('/search')).
    # Drop it and requests become :7700/fabdiscover/search → 404. Route-agnostic:
    # /geo (Phase 4.6) is already covered once the reader ships it.
    proxy_pass         http://127.0.0.1:7700/;
    proxy_set_header   Host $host;
    proxy_http_version 1.1;

    # Trust boundary: app-layer MaxMind reads the rightmost X-Forwarded-For hop,
    # so hand it the real client IP. The reader must trust ONLY this last hop.
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

    # Anti-spoof: blank the client-settable geo headers. No CDN fronts this
    # today; CF-IPCountry / CloudFront-Viewer-Country are neutralized defensively.
    # When a real CDN fronts THIS nginx (and nothing else can reach it), set the
    # canonical header here instead of blanking, e.g. X-Geo-Country $http_cf_ipcountry.
    proxy_set_header   X-Geo-Country "";
    proxy_set_header   CF-IPCountry "";
    proxy_set_header   CloudFront-Viewer-Country "";

    # No CORS here — the fabdiscover-search reader sets Access-Control-Allow-Origin
    # itself (CORS_ORIGIN env). Adding it here too = double-ACAO, which browsers
    # reject. (Contrast the fabcdn blocks, which DO own their CORS.)
}
