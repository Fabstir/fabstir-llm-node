# fiat.fabstir.net — reverse proxy to the fiat-service (systemd unit `fiat-service`,
# Next.js on 127.0.0.1:3020, see services/fiat-service/).
# Deploys to /etc/nginx/sites-available/fiat.fabstir.net with a symlink in
# sites-enabled/. Captured 2026-08-03 from the live box (fabstirserv1), where it had
# existed only on-disk since 22 July — RESTORE-host1.md did not cover it.
#
# Scope is deliberately /v1/fiat/ ONLY: the service has no routes outside that
# prefix (no /health, no /). Anything else falls through to nginx's defaults, which
# is why wrong-path probes read the whole service as "not deployed" (2026-08-03
# incident). Probe /v1/fiat/balance?address=<addr>, never an invented path.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fiat.fabstir.net;

    ssl_certificate /etc/letsencrypt/live/fiat.fabstir.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fiat.fabstir.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /v1/fiat/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A card session open is bounded at 170 s inside the service (CREATE_DEADLINE_MS,
        # src/lib/fiat-vault.ts) and the helper waits 180 s. nginx's 60 s default would 504
        # an open that is still on its way to the chain.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
