# FabCDN edge — http-context directives (maps + proxy_cache_path).
#
# host1.fabstir.net variant. Same logic as host2/, sized smaller to fit
# host1's available disk (deployed with ~69 GB free, leaving headroom for
# model files and transcode scratch).
#
# Prod: drops into /etc/nginx/conf.d/10-fabcdn-map.conf. The `10-` prefix
# orders this file before other conf.d drop-ins so the fabcdn keys_zone
# and $fabcdn_* maps are defined before the server block that uses them.

# 25 GB LRU, 30-day inactive eviction, 100 MB in-memory metadata.
proxy_cache_path /var/cache/fabcdn levels=1:2 keys_zone=fabcdn:100m
                 max_size=25g inactive=30d use_temp_path=off;

# Cacheable prefixes:
#   /s5/blob/  the portal call that returns the 307
#   /dl/       legacy byte path (dl.platformlessai.ai); dormant, kept working
#   /r2/       byte path the portal presigns today (R2), bounced back here
# ⚠ Every byte-serving location MUST appear here. $fabcdn_bypass defaults to 1,
# so a location missing from this list reads BYPASS forever and caches nothing —
# it fails silently, with a perfectly healthy-looking 200.
map $request_uri $fabcdn_is_blob {
    default              0;
    ~^/fabcdn/s5/blob/   1;
    ~^/fabcdn/dl/        1;
    ~^/fabcdn/r2/        1;
}

# Is this a HEAD request?
map $request_method $fabcdn_is_head {
    default 0;
    HEAD    1;
}

# proxy_cache_bypass: when 1, skip reading the cache (pass to origin).
# Non-blob paths bypass; blob paths (incl. HEAD) read the cache.
map $fabcdn_is_blob $fabcdn_bypass {
    default 1;
    1       0;
}

# proxy_no_cache: when 1, don't write to the cache.
# Only blob-path GETs ("1:0") may write; everything else is 1.
map "$fabcdn_is_blob:$fabcdn_is_head" $fabcdn_no_write {
    default 1;
    "1:0"   0;
}
