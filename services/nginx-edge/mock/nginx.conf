# FabCDN edge — mock nginx.conf (thin wrapper for local docker-compose).
#
# Lives at /etc/nginx/nginx.conf inside the nginx:alpine container, replacing
# the stock config. Uses explicit includes (no glob) so the image's
# default.conf under /etc/nginx/conf.d/ isn't loaded — only our map file,
# mounted at /etc/nginx/conf.d/10-fabcdn-map.conf, is picked up.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    'cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;

    # Maps + proxy_cache_path (shared with prod).
    include /etc/nginx/conf.d/10-fabcdn-map.conf;

    server {
        listen      80;
        server_name localhost;

        # The cached /fabcdn/ location (shared with prod).
        include /etc/nginx/snippets/fabcdn-location.conf;
    }
}
