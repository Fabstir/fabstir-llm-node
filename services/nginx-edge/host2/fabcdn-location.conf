# FabCDN edge — three location blocks.
#   /fabcdn/s5/blob/{cid}  → S5 portal, returns 307 (rewritten back to our edge)
#   /fabcdn/dl/…           → dl.platformlessai.ai, legacy byte delivery + cache
#   /fabcdn/r2/…           → R2 direct, byte delivery + cache (current path)
#
# Prod: drops into /etc/nginx/snippets/fabcdn-location.conf and is picked up
# via a one-line `include …;` inside the host2.fabstir.net server block.
# Mock: same path inside nginx:alpine, included from mock/nginx.conf.
# Depends on the maps + keys_zone defined in 10-fabcdn-map.conf.

# ---- /fabcdn/ — S5 portal (redirect fetcher; bytes served via /fabcdn/r2/) ----
location /fabcdn/ {
    proxy_cache              fabcdn;
    proxy_cache_valid        200 206 30d;
    # ⚠ The 307's Location carries a presigned URL with X-Amz-Expires=86400.
    # Caching the redirect longer than the presign hands out dead links.
    # Short TTL still collapses the portal round-trip storm.
    proxy_cache_valid        307 5m;
    proxy_cache_valid        404 1m;
    proxy_cache_key          $scheme$proxy_host$uri;
    proxy_cache_lock         on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_methods      GET HEAD;
    proxy_no_cache           $fabcdn_no_write;
    proxy_cache_bypass       $fabcdn_bypass;

    proxy_pass               https://s5.platformlessai.ai/;
    proxy_ssl_server_name    on;
    proxy_ssl_name           s5.platformlessai.ai;
    proxy_set_header         Host s5.platformlessai.ai;
    proxy_pass_request_headers on;
    proxy_http_version       1.1;

    # Rewrite the 307's Location so the browser bounces back to our edge
    # (otherwise bytes flow direct from dl.platformlessai.ai, bypassing cache).
    proxy_redirect           https://dl.platformlessai.ai/ https://host2.fabstir.net/fabcdn/dl/;
    # The portal presigns R2 directly today. Bounce those back through the edge
    # too. If the portal ever rotates buckets this simply stops matching and
    # delivery degrades to today's direct-and-uncached — the safe failure.
    proxy_redirect           https://f87d7fde7316770276e6b067f8af68d2.r2.cloudflarestorage.com/
                             https://host2.fabstir.net/fabcdn/r2/;

    proxy_ssl_verify             on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_protocols          TLSv1.2 TLSv1.3;
    proxy_connect_timeout    10s;
    proxy_read_timeout       120s;
    proxy_send_timeout       30s;

    add_header X-Cache  $upstream_cache_status always;
    add_header X-Origin s5.platformlessai.ai   always;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    add_header Access-Control-Allow-Origin   "*"                             always;
    add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS"            always;
    add_header Access-Control-Expose-Headers "X-Cache, X-Origin, ETag, Content-Length" always;

    proxy_buffering          on;
    proxy_buffer_size        16k;
    proxy_buffers            32 64k;
    proxy_busy_buffers_size  256k;
}

# ---- /fabcdn/dl/ — legacy byte delivery, cached ----
# Dormant: the portal presigns R2 rather than redirecting here. Kept correct
# (and sliced) so it is safe the moment the portal ever points back at it.
location /fabcdn/dl/ {
    # ⚠ slice is what makes ranged media cacheable. nginx fetches fixed 1 MB
    # slices and caches each under its own key; without it, caching 206 under a
    # range-less key makes two different byte ranges collide on one entry and
    # nginx serves whichever landed first for both — silently corrupt video.
    slice                    1m;
    proxy_set_header         Range $slice_range;

    proxy_cache              fabcdn;
    proxy_cache_valid        200 206 30d;
    proxy_cache_valid        404 1m;
    proxy_cache_key          $scheme$proxy_host$uri$slice_range;
    proxy_cache_lock         on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_methods      GET HEAD;
    proxy_no_cache           $fabcdn_no_write;
    proxy_cache_bypass       $fabcdn_bypass;

    proxy_pass               https://dl.platformlessai.ai/;
    proxy_ssl_server_name    on;
    proxy_ssl_name           dl.platformlessai.ai;
    proxy_set_header         Host dl.platformlessai.ai;
    proxy_pass_request_headers on;
    proxy_http_version       1.1;

    proxy_ssl_verify             on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_protocols          TLSv1.2 TLSv1.3;
    proxy_connect_timeout    10s;
    proxy_read_timeout       120s;
    proxy_send_timeout       30s;

    add_header X-Cache  $upstream_cache_status always;
    add_header X-Origin dl.platformlessai.ai   always;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    add_header Access-Control-Allow-Origin   "*"                             always;
    add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS"            always;
    add_header Access-Control-Expose-Headers "X-Cache, X-Origin, ETag, Content-Length" always;

    proxy_buffering          on;
    proxy_buffer_size        16k;
    proxy_buffers            32 64k;
    proxy_busy_buffers_size  256k;
}

# ---- /fabcdn/r2/ — byte delivery from R2, cached in 1 MB slices ----
# The portal presigns R2 directly; location /fabcdn/ bounces those 307s back
# here so the bytes are cached at the edge instead of flowing browser→R2.
#
# The presign survives the proxy: it carries X-Amz-SignedHeaders=host, so SigV4
# covers method, path, query and Host and nothing else. We preserve path+query
# and restore the signed Host below. Range is unsigned, so slice rewriting it
# cannot break the signature. (Verified against R2 2026-09-02.)
location /fabcdn/r2/ {
    # ⚠ slice is what makes ranged media cacheable. nginx fetches fixed 1 MB
    # slices and caches each under its own key; without it, caching 206 under a
    # range-less key makes two different byte ranges collide on one entry and
    # nginx serves whichever landed first for both — silently corrupt video.
    slice                    1m;
    proxy_set_header         Range $slice_range;

    proxy_cache              fabcdn;
    proxy_cache_valid        200 206 30d;
    proxy_cache_valid        404 1m;
    # $slice_range is REQUIRED in the key — see the slice note above.
    # $args is deliberately EXCLUDED: the presigned signature rotates, so
    # including it would give every request a fresh key and nothing would hit.
    # Consequence, accepted: warm bytes are served without re-checking the
    # signature. FabCDN is ciphertext-only by design, but these paths are an
    # unauthenticated mirror once cached.
    proxy_cache_key          $scheme$proxy_host$uri$slice_range;
    proxy_cache_lock         on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_methods      GET HEAD;
    proxy_no_cache           $fabcdn_no_write;
    proxy_cache_bypass       $fabcdn_bypass;

    # 403 is deliberately absent from proxy_cache_valid: a cold slice fetched
    # with an expired presign must not be cached as a negative result.
    proxy_pass               https://f87d7fde7316770276e6b067f8af68d2.r2.cloudflarestorage.com/;
    proxy_ssl_server_name    on;
    proxy_ssl_name           f87d7fde7316770276e6b067f8af68d2.r2.cloudflarestorage.com;
    proxy_set_header         Host f87d7fde7316770276e6b067f8af68d2.r2.cloudflarestorage.com;
    proxy_pass_request_headers on;
    proxy_http_version       1.1;

    proxy_ssl_verify             on;
    proxy_ssl_verify_depth       5;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_protocols          TLSv1.2 TLSv1.3;
    proxy_connect_timeout    10s;
    proxy_read_timeout       120s;
    proxy_send_timeout       30s;

    add_header X-Cache  $upstream_cache_status always;
    add_header X-Origin r2.cloudflarestorage.com always;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    add_header Access-Control-Allow-Origin   "*"                  always;
    add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Expose-Headers "X-Cache, X-Origin, ETag, Content-Length, Content-Range, Accept-Ranges" always;

    proxy_buffering          on;
    proxy_buffer_size        16k;
    proxy_buffers            32 64k;
    proxy_busy_buffers_size  256k;
}
