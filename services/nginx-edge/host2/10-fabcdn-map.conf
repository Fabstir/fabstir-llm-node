# FabCDN edge — http-context directives (maps + proxy_cache_path).
#
# Prod: drops into /etc/nginx/conf.d/10-fabcdn-map.conf. The `10-` prefix
# orders this file before other conf.d drop-ins so the fabcdn keys_zone
# and $fabcdn_* maps are defined before the server block that uses them.
# Mock: same path inside nginx:alpine, loaded via explicit include from
# mock/nginx.conf (no glob — avoids picking up the image's default.conf).

# 50 GB LRU, 30-day inactive eviction, 100 MB in-memory metadata.
# Host has 326 GB free on / (verified pre-deploy).
proxy_cache_path /var/cache/fabcdn levels=1:2 keys_zone=fabcdn:100m
                 max_size=50g inactive=30d use_temp_path=off;

# Cacheable prefixes: /s5/blob/ (returns 307 to dl.platformlessai.ai),
# /dl/ (where the blob bytes actually live post-redirect).
map $request_uri $fabcdn_is_blob {
    default              0;
    ~^/fabcdn/s5/blob/   1;
    ~^/fabcdn/dl/        1;
}

# Is this a HEAD request?
map $request_method $fabcdn_is_head {
    default 0;
    HEAD    1;
}

# proxy_cache_bypass: when 1, skip reading the cache (pass to origin).
# Non-blob paths bypass; blob paths (incl. HEAD) read the cache.
map $fabcdn_is_blob $fabcdn_bypass {
    default 1;
    1       0;
}

# proxy_no_cache: when 1, don't write to the cache.
# Only blob-path GETs ("1:0") may write; everything else is 1.
map "$fabcdn_is_blob:$fabcdn_is_head" $fabcdn_no_write {
    default 1;
    "1:0"   0;
}
