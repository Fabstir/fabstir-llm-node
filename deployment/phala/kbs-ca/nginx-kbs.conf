# kbs.fabstir.net — the Fabstir key broker behind nginx (Phase 5).
# Private CA (deployment/phala/kbs-ca/README.md): nodes pin the root that
# signed /etc/fabstir-kbs/tls/kbs.pem; TLS 1.3 only; no port 80.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kbs.fabstir.net;

    ssl_certificate     /etc/fabstir-kbs/tls/kbs.pem;
    ssl_certificate_key /etc/fabstir-kbs/tls/kbs.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # Attestation evidence is a few tens of KB (quote ~5 KB, GPU cert chain +
    # report ~12 KB base64, event log); anything near this is not a node.
    client_max_body_size 1m;
    client_body_timeout 10s;

    # The broker (P4): loopback only, systemd unit fabstir-kbs, in the
    # fiat-service pattern. 502 until it runs, which is the right fail-closed state.
    location /v1/kbs/ {
        proxy_pass http://127.0.0.1:3030/v1/kbs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # Nothing else is served. No index, no status page, no ACME.
    location / {
        return 404;
    }
}
