# kbs.fabstir.net — the Fabstir key broker behind nginx (Phase 5).
# Private CA (deployment/phala/kbs-ca/README.md): nodes pin the root that
# signed /etc/fabstir-kbs/tls/kbs.pem; TLS 1.3 only; no port 80.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kbs.fabstir.net;

    ssl_certificate     /etc/fabstir-kbs/tls/kbs.pem;
    ssl_certificate_key /etc/fabstir-kbs/tls/kbs.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # Attestation evidence is a few tens of KB (quote ~5 KB, GPU cert chain +
    # report ~12 KB base64, event log); anything near this is not a node.
    client_max_body_size 1m;
    client_body_timeout 10s;

    # The broker (P4): loopback only, systemd unit fabstir-kbs, in the
    # fiat-service pattern. 502 until it runs, which is the right fail-closed state.
    location /v1/kbs/ {
        # Zones live in /etc/nginx/conf.d/kbs-limits.conf (http{} context; see
        # deployment/kbs/). burst=20 nodelay: the node's challenge + request_key
        # pair inside 100 ms must not get a 503 HTML page it reads as Kbs("HTTP 503").
        limit_req zone=kbs burst=20 nodelay;
        limit_conn kbs_conn 16;
        proxy_pass http://127.0.0.1:3030/v1/kbs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the broker's per-source caps key on the LAST
        # element and must not be spoofable by the client.
        proxy_set_header X-Forwarded-For $remote_addr;
        # request_key spans the DCAP collateral fetch and the NRAS round trip on
        # the broker side, and a nonce is burned on arrival, so the node waits up
        # to 180 s (kbs_http::DEFAULT_REQUEST_KEY_TIMEOUT). nginx must outlast
        # that or it answers 504 at 60 s with the nonce already gone.
        proxy_read_timeout 200s;
    }

    # The signed policies and the encrypted containers, served as static files
    # so the node needs no other host (its policy/blob clients trust this
    # private root). Place them under /var/lib/fabstir-kbs/public/{policies,blobs}.
    # Nothing is listed; a missing file is 404, which the node treats as a
    # refused boot (exit 78), never as "try elsewhere".
    location /policies/ {
        root /var/lib/fabstir-kbs/public;
        autoindex off;
        types { application/json json; }
        default_type application/octet-stream;
    }
    location /blobs/ {
        root /var/lib/fabstir-kbs/public;
        autoindex off;
        default_type application/octet-stream;
        # A model container is GBs; let a slow CVM download run.
        send_timeout 1800s;
    }

    # Nothing else is served. No index, no status page, no ACME.
    location / {
        return 404;
    }
}
